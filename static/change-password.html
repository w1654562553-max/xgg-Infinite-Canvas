<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>修改密码 - AI Studio</title>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.06.18.1781685818"></script>
    <script src="/static/js/theme.js?v=2026.06.18.1781685818"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.06.18.1781685818');

        :root {
            --accent: #000000;
            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            --bg: #ffffff;
            --sidebar-bg: #ffffff;
            --border: #f2f2f2;
            --text: #121212;
            --muted: #999;
            --nav-hover-bg: #fafafa;
        }
        html.theme-dark, body.theme-dark {
            --bg: #0f141d;
            --sidebar-bg: #0f141d;
            --border: #242d3b;
            --text: #e5e9f0;
            --muted: #8f9aab;
            --nav-hover-bg: #171d29;
        }

        body {
            background: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
        }

        .logo {
            width: 56px; height: 56px;
            border: 2px solid var(--text);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 28px; font-size: 24px; font-weight: 600;
        }

        h1 { font-size: 22px; font-weight: 600; text-align: center; margin: 0 0 8px; }
        .subtitle { font-size: 13px; color: var(--muted); text-align: center; margin: 0 0 32px; }

        .form-group { margin-bottom: 18px; }
        .form-label {
            display: block; font-size: 12px; font-weight: 500;
            color: var(--muted); margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .form-input {
            width: 100%; padding: 14px 16px;
            border: 1px solid var(--border); border-radius: 12px;
            background: var(--bg); color: var(--text);
            font-size: 14px; font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .form-input:focus {
            outline: none; border-color: var(--text);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
        }
        html.theme-dark .form-input:focus, body.theme-dark .form-input:focus {
            box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
        }

        .submit-btn {
            width: 100%; padding: 14px 16px;
            background: var(--text); color: var(--bg);
            border: none; border-radius: 12px;
            font-size: 14px; font-weight: 600; font-family: inherit;
            cursor: pointer; margin-top: 12px;
        }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .err {
            background: rgba(220,38,38,0.08); color: #dc2626;
            padding: 10px 14px; border-radius: 10px;
            font-size: 13px; margin-top: 12px; text-align: center; display: none;
        }
        html.theme-dark .err, body.theme-dark .err { color: #f87171; }

        .success {
            background: rgba(34,197,94,0.08); color: #16a34a;
            padding: 10px 14px; border-radius: 10px;
            font-size: 13px; margin-top: 12px; text-align: center; display: none;
        }
        html.theme-dark .success, body.theme-dark .success { color: #4ade80; }

        .tip {
            font-size: 11px; color: var(--muted);
            text-align: center; margin-top: 24px; line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">AI</div>
        <h1 id="title">修改密码</h1>
        <p class="subtitle" id="subtitle">首次登录请设置一个新密码</p>

        <form id="form">
            <div class="form-group">
                <label class="form-label" for="old">旧密码</label>
                <input class="form-input" type="password" id="old" autocomplete="current-password" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="new1">新密码</label>
                <input class="form-input" type="password" id="new1" autocomplete="new-password" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label" for="new2">确认新密码</label>
                <input class="form-input" type="password" id="new2" autocomplete="new-password" required minlength="6">
            </div>
            <button type="submit" class="submit-btn" id="btn">确认修改</button>
            <div class="err" id="err"></div>
            <div class="success" id="success"></div>
        </form>

        <p class="tip">
            新密码至少 6 位，且不能与旧密码相同。
        </p>
    </div>

    <script>
        (function() {
            const isFirst = new URLSearchParams(location.search).get('first') === '1';
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');
            if (!isFirst) {
                title.textContent = '修改密码';
                subtitle.textContent = '请输入旧密码和新密码';
            }

            const token = localStorage.getItem('auth_token');
            if (!token) {
                location.replace('/static/login.html');
                return;
            }

            const form = document.getElementById('form');
            const btn = document.getElementById('btn');
            const errEl = document.getElementById('err');
            const successEl = document.getElementById('success');

            function showError(msg) { errEl.textContent = msg; errEl.style.display = 'block'; successEl.style.display = 'none'; }
            function showSuccess(msg) { successEl.textContent = msg; successEl.style.display = 'block'; errEl.style.display = 'none'; }

            form.addEventListener('submit', async function(ev) {
                ev.preventDefault();
                const old = document.getElementById('old').value;
                const new1 = document.getElementById('new1').value;
                const new2 = document.getElementById('new2').value;
                if (new1 !== new2) {
                    showError('两次输入的新密码不一致');
                    return;
                }
                if (new1.length < 6) {
                    showError('新密码至少 6 位');
                    return;
                }
                if (new1 === old) {
                    showError('新密码不能和旧密码相同');
                    return;
                }
                btn.disabled = true;
                btn.textContent = '提交中…';
                try {
                    const resp = await fetch('/api/me/password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify({ old_password: old, new_password: new1 }),
                    });
                    if (!resp.ok) {
                        const d = await resp.json().catch(() => ({}));
                        throw new Error(d.detail || '修改失败');
                    }
                    showSuccess(isFirst ? '密码已设置，即将进入主页…' : '密码已修改，即将进入主页…');
                    setTimeout(() => location.replace('/'), 1200);
                } catch (e) {
                    showError(e.message || '修改失败');
                    btn.disabled = false;
                    btn.textContent = '确认修改';
                }
            });
        })();
    </script>
</body>
</html>
